# Medusa + Postgres + Redis + nginx (EC2 / production).
# Copy this file, nginx/default.conf, and .env.prod to ~/medusa on the server.
#
#   docker compose pull
#   docker compose up -d
services:
  medusa:
    image: 409796440499.dkr.ecr.ap-south-1.amazonaws.com/medusa-backend:latest
    container_name: medusa-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: "9000"
      REDIS_URL: redis://redis:6379
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: medusa-postgres
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - medusa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    restart: unless-stopped
    volumes:
      - medusa_redis:/data

  nginx:
    image: nginx:1.28-alpine
    container_name: medusa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - medusa

volumes:
  medusa_postgres:
  medusa_redis:
