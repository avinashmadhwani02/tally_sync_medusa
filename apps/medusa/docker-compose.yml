# Pull and run the Medusa image (same pattern as Neev).
# Postgres is the existing tally_sync database — not started here.
# In the container .env, use REDIS_URL=redis://redis:6379
# and a DATABASE_URL the container can reach (not localhost).
services:
  medusa:
    image: 409796440499.dkr.ecr.ap-south-1.amazonaws.com/medusa-backend:latest
    container_name: medusa-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "9000"
      REDIS_URL: redis://redis:6379
    expose:
      - "9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    restart: unless-stopped
    volumes:
      - medusa_redis:/data

  nginx:
    image: nginx:1.28-alpine
    container_name: medusa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - medusa

volumes:
  medusa_redis:
