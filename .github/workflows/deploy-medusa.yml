name: Build and Push Medusa Image

on:
  push:
    branches:
      - main
    paths:
      - "apps/medusa/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-medusa.yml"

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: medusa-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -f apps/medusa/Dockerfile \
            --build-arg MEDUSA_URL=${{ vars.MEDUSA_URL || 'http://65.0.7.35' }} \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .

          docker tag $ECR_REPOSITORY:${{ github.sha }} \
            ${{ secrets.ECR_REGISTRY }}/$ECR_REPOSITORY:${{ github.sha }}

          docker tag $ECR_REPOSITORY:${{ github.sha }} \
            ${{ secrets.ECR_REGISTRY }}/$ECR_REPOSITORY:latest

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/$ECR_REPOSITORY:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/$ECR_REPOSITORY:latest
