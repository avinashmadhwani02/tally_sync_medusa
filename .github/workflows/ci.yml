name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sync-tests:
    name: Sync app tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --ignore-scripts skips Medusa's `prisma generate` and Electron's
        # binary download (both unnecessary for the pure-JS sync tests), which
        # keeps CI fast and free of DB/network config requirements.
        run: npm ci --ignore-scripts

      - name: Run sync unit tests
        run: npm run test -w @tally-sync/sync
